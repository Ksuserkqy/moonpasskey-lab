# Ubuntu 22.04 site fragment. Enable only after public TLS and Basic Auth exist.
# This is a restricted TEST ONLY reference RP, including its Dashboard and APIs.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name passkey-test.ksuser.cn;
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/passkey-test.ksuser.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/passkey-test.ksuser.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Never replace an unexpected incoming Host with the trusted backend Host.
    if ($http_host != "passkey-test.ksuser.cn") { return 444; }

    # Server scope covers every HTTPS application path, including /api/ and assets.
    satisfy all;
    auth_basic "MoonPasskey Lab TEST ONLY";
    auth_basic_user_file /etc/nginx/moonpasskey.htpasswd;

    location / {
        proxy_pass https://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # A private CA is trusted only for this upstream, never as a system root.
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 1;
        proxy_ssl_trusted_certificate /etc/moonpasskey/tls/backend-ca.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name passkey-test.ksuser.cn;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Drop all client headers first. This excludes Authorization, Forwarded,
        # every X-Forwarded-* variant, and X-Real-IP; the RP trusts no proxy headers.
        proxy_pass_request_headers off;
        proxy_set_header Authorization "";
        proxy_set_header Host passkey-test.ksuser.cn;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
        proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;

        # Keep RP errors, Set-Cookie, and security response headers unchanged.
        proxy_intercept_errors off;
        proxy_redirect off;
    }
}
