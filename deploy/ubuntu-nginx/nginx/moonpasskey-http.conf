# Ubuntu 22.04 site fragment. Enable this first for ACME HTTP-01 issuance.
# Keep enabled after HTTPS is installed so certificate renewal stays reachable.
server {
    listen 80;
    listen [::]:80;
    server_name passkey-test.ksuser.cn;

    # Check the received authority before serving ACME or constructing redirects.
    if ($http_host != "passkey-test.ksuser.cn") { return 444; }

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/moonpasskey-acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://passkey-test.ksuser.cn$request_uri;
    }
}
